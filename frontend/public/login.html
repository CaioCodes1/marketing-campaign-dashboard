<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Marketing Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/css/tokens.css" />
  <link rel="stylesheet" href="../src/css/base.css" />
  <link rel="stylesheet" href="../src/css/components.css" />
  <link rel="stylesheet" href="../src/css/themes.css" />
</head>
<body>
  <div class="login-page">
    <form class="card login-card" id="login-form">
      <h1>Marketing Dashboard</h1>
      <p class="text-secondary">Entre para gerenciar suas campanhas.</p>

      <div class="form-field full">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="voce@agencia.com" />
      </div>
      <div class="form-field full">
        <label for="password">Senha</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>

      <p id="login-error" style="color: var(--danger-500); font-size: 13px;"></p>

      <button type="submit" class="btn btn-primary">Entrar</button>
      <p class="text-secondary" style="font-size: 12px; text-align: center;">
        Demo: caio@agencia.com / senha123
      </p>
    </form>
  </div>

  <script type="module" src="../src/js/pages/login.page.js"></script>
</body>
</html>

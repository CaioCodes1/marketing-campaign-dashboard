<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campanhas — Marketing Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/css/tokens.css" />
  <link rel="stylesheet" href="../src/css/base.css" />
  <link rel="stylesheet" href="../src/css/components.css" />
  <link rel="stylesheet" href="../src/css/themes.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <div class="main-content">
      <div id="topbar-root"></div>

      <main class="page">
        <div class="page-header">
          <h1 class="page-title">Campanhas</h1>
          <button class="btn btn-primary" id="new-campaign-btn">+ Nova Campanha</button>
        </div>

        <div class="filters-bar">
          <input class="text-input" type="search" id="search-input" placeholder="Buscar por nome ou cliente..." />
          <select class="select" id="status-filter">
            <option value="">Todos os status</option>
            <option value="planned">Planejada</option>
            <option value="active">Ativa</option>
            <option value="paused">Pausada</option>
            <option value="completed">Finalizada</option>
            <option value="cancelled">Cancelada</option>
          </select>
          <select class="select" id="platform-filter">
            <option value="">Todas as plataformas</option>
            <option value="instagram">Instagram</option>
            <option value="facebook">Facebook</option>
            <option value="google_ads">Google Ads</option>
            <option value="tiktok">TikTok</option>
            <option value="linkedin">LinkedIn</option>
            <option value="other">Outra</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-sort="name">Nome</th>
                <th>Cliente</th>
                <th>Plataforma</th>
                <th data-sort="status">Status</th>
                <th data-sort="budget">Orçamento</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="campaigns-tbody"></tbody>
          </table>
          <div class="pagination" id="pagination"></div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay hidden" id="campaign-modal">
    <form class="modal" id="campaign-form">
      <div class="modal-header">
        <h2 id="modal-title">Nova Campanha</h2>
        <button type="button" class="icon-btn" id="modal-close-btn">&times;</button>
      </div>

      <div class="form-grid">
        <div class="form-field full">
          <label for="field-name">Nome</label>
          <input id="field-name" required />
        </div>
        <div class="form-field">
          <label for="field-client">Cliente</label>
          <select id="field-client" required></select>
        </div>
        <div class="form-field">
          <label for="field-platform">Plataforma</label>
          <select id="field-platform" required>
            <option value="instagram">Instagram</option>
            <option value="facebook">Facebook</option>
            <option value="google_ads">Google Ads</option>
            <option value="tiktok">TikTok</option>
            <option value="linkedin">LinkedIn</option>
            <option value="other">Outra</option>
          </select>
        </div>
        <div class="form-field full">
          <label for="field-description">Descrição</label>
          <textarea id="field-description" rows="2"></textarea>
        </div>
        <div class="form-field">
          <label for="field-objective">Objetivo</label>
          <input id="field-objective" />
        </div>
        <div class="form-field">
          <label for="field-status">Status</label>
          <select id="field-status">
            <option value="planned">Planejada</option>
            <option value="active">Ativa</option>
            <option value="paused">Pausada</option>
            <option value="completed">Finalizada</option>
            <option value="cancelled">Cancelada</option>
          </select>
        </div>
        <div class="form-field">
          <label for="field-budget">Orçamento (R$)</label>
          <input id="field-budget" type="number" step="0.01" min="0" required />
        </div>
        <div class="form-field">
          <label for="field-spent">Já investido (R$)</label>
          <input id="field-spent" type="number" step="0.01" min="0" />
        </div>
        <div class="form-field">
          <label for="field-start">Data de início</label>
          <input id="field-start" type="date" required />
        </div>
        <div class="form-field">
          <label for="field-end">Data final</label>
          <input id="field-end" type="date" required />
        </div>
        <div class="form-field">
          <label for="field-responsible">Responsável</label>
          <select id="field-responsible" required></select>
        </div>
        <div class="form-field full">
          <label for="field-notes">Observações</label>
          <textarea id="field-notes" rows="2"></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="modal-cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </div>

  <script type="module" src="../src/js/pages/campaigns.page.js"></script>
</body>
</html>
